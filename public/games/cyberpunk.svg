<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#121b2d"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- Neon Grid Silhouette -->
  <g opacity="0.25" stroke="#00e5ff" stroke-width="1">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="400" y1="280" x2="200" y2="450"/>
    <line x1="400" y1="280" x2="600" y2="450"/>
    <line x1="400" y1="280" x2="350" y2="450"/>
    <line x1="400" y1="280" x2="450" y2="450"/>
  </g>
  <!-- Cyberpunk Emblem / Typography -->
  <text x="400" y="210" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">CYBERPUNK</text>
  <text x="400" y="250" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="url(#accent)" letter-spacing="8">2077 : PHANTOM LIBERTY</text>
</svg>
